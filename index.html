<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recipes with Geep</title>
<meta name="theme-color" content="#fff8ee">
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#28342b;background:#fffaf3}
*{box-sizing:border-box}
body{margin:0}header{background:#f0e9d9;padding:32px 20px;text-align:center}
h1{font-size:clamp(2rem,7vw,3rem);margin:0 0 8px}header p{margin:0;color:#657163}
main{max-width:740px;margin:auto;padding:24px 18px 70px}
label{display:block;font-weight:600;margin-bottom:8px}
input{width:100%;font:inherit;padding:13px 15px;border:1px solid #c8cbbf;border-radius:12px;background:white}
#status{color:#647166;font-size:.92rem;margin:15px 0}
ul{list-style:none;padding:0;margin:0;display:grid;gap:11px}
li a{display:flex;align-items:center;gap:13px;background:white;border:1px solid #e4dfd4;border-radius:14px;padding:16px;color:#28342b;text-decoration:none;box-shadow:0 2px 6px #3b2e1710}
li a:hover,li a:focus{border-color:#9cae91;background:#f7fbf5}
li a span:first-child{font-size:1.5rem}
small{display:block;color:#7a8075;margin-top:4px}
footer{text-align:center;color:#7c8076;font-size:.85rem;padding:15px}
button{background:#47654d;color:white;border:0;border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer}
</style>
</head>
<body>
<header><h1>🍋 Recipes with Geep</h1><p>Our little collection of kitchen favourites</p></header>
<main>
<label for="search">Find a recipe</label>
<input id="search" type="search" placeholder="Search recipes…" autocomplete="off">
<p id="status" role="status">Finding your recipes…</p>
<ul id="recipes"></ul>
<div id="retry" hidden><button type="button" onclick="loadRecipes()">Try again</button></div>
</main>
<footer>New recipes appear automatically after you upload them to GitHub.</footer>
<script>
const owner="wendysilverleaf-beep", repo="Recipes-with-Geep", branch="main";
const list=document.querySelector("#recipes"), status=document.querySelector("#status");
let all=[];
function titleFrom(filename){
  return filename.replace(/\.html$/i,"")
    .replace(/(?:_anylist|_family_favourite|_family_favorite)(?=_|$)/gi,"")
    .replace(/_v(\d+)(?=_|$)/gi," (version $1)")
    .replace(/_+/g," ").replace(/-/g," ")
    .replace(/\b\w/g,c=>c.toUpperCase()).trim();
}
function render(){
 const q=document.querySelector("#search").value.trim().toLowerCase();
 const matches=all.filter(x=>titleFrom(x.name).toLowerCase().includes(q));
 list.replaceChildren();
 for(const file of matches){
   const li=document.createElement("li"), a=document.createElement("a");
   a.href=encodeURIComponent(file.name); // relative link to the published HTML page
   const emoji=document.createElement("span");emoji.textContent="🍽️";
   const title=document.createElement("span");title.textContent=titleFrom(file.name);
   a.append(emoji,title);li.append(a);list.append(li);
 }
 status.textContent=all.length
   ? `${matches.length} recipe${matches.length===1?"":"s"}${q?" found":" in your collection"}`
   : "No recipes found yet.";
}
async function loadRecipes(){
 document.querySelector("#retry").hidden=true;
 status.textContent="Finding your recipes…";
 try{
   const url=`https://api.github.com/repos/${owner}/${repo}/contents/?ref=${branch}`;
   const res=await fetch(url,{cache:"no-store",headers:{"Accept":"application/vnd.github+json"}});
   if(!res.ok)throw new Error("GitHub returned "+res.status);
   const files=await res.json();
   if(!Array.isArray(files))throw new Error("Unexpected response");
   all=files.filter(f=>f.type==="file"&&/\.html$/i.test(f.name)&&f.name.toLowerCase()!=="index.html")
     .sort((a,b)=>titleFrom(a.name).localeCompare(titleFrom(b.name)));
   render();
 }catch(err){
   status.textContent="Couldn't load the recipe list just now. Please try again.";
   document.querySelector("#retry").hidden=false;
   console.error(err);
 }
}
document.querySelector("#search").addEventListener("input",render);
loadRecipes();
</script>
</body>
</html>
